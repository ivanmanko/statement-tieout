[project]
name = "statement-tieout"
version = "0.1.0"
description = "Bank statement extraction with self-verifying reconciliation"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "rapidocr-onnxruntime>=1.4",
    # rapidocr asks for opencv-python, whose wheel links a windowing system:
    # libGL and libxcb, and behind libGL a software OpenGL stack — 180 MB of
    # renderer in a service that draws nothing. The headless wheel is the same
    # library without the GUI module, so the override below drops the GUI one
    # and this pulls in its replacement; `import cv2` resolves to the same
    # `cv2` either way.
    "opencv-python-headless>=4.10",
    "openai>=3.7.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
]

[project.scripts]
statement-tieout = "statement_tieout.cli:main"

[tool.uv]
# A marker that is never true removes the requirement rather than resolving it.
override-dependencies = ["opencv-python; sys_platform == 'nonexistent'"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "reportlab>=5.0.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statement_tieout"]

[tool.hatch.build.targets.wheel.force-include]
"src/statement_tieout/web/page.html" = "statement_tieout/web/page.html"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies in argument defaults on purpose; that is the
# framework's contract, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
