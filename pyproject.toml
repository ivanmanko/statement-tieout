[project]
name = "statement-tieout"
version = "0.1.0"
description = "Bank statement extraction with self-verifying reconciliation"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "rapidocr-onnxruntime>=1.4",
    "openai>=3.7.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
]

[project.scripts]
statement-tieout = "statement_tieout.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statement_tieout"]

[tool.hatch.build.targets.wheel.force-include]
"src/statement_tieout/web/page.html" = "statement_tieout/web/page.html"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies in argument defaults on purpose; that is the
# framework's contract, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
